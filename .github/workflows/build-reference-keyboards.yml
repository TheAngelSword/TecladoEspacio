name: Build reference keyboards without period

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-reference-keyboards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heliboard:
    name: HeliBoard Sin Punto
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Clone pinned HeliBoard
        run: |
          git clone https://github.com/HeliBorg/HeliBoard.git src
          cd src
          git checkout 4ffe9c6b3fab11cc6a435884502dd5eeb327fca7
          git submodule update --init --recursive
      - name: Remove direct period key only
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/layouts/functional/functional_keys.json')
          s=p.read_text()
          old='    { "label": "period", "labelFlags": 1073741824 },\n'
          if old not in s:
              raise SystemExit('Expected HeliBoard period key not found')
          p.write_text(s.replace(old,'',1))
          PY
          git diff --check
          git diff > ../HeliBoard-SinPunto.patch
      - name: Source privacy scan
        working-directory: src
        run: |
          {
            echo 'PROJECT=HeliBoard'
            echo 'UPSTREAM=https://github.com/HeliBorg/HeliBoard'
            echo 'PINNED_SHA=4ffe9c6b3fab11cc6a435884502dd5eeb327fca7'
            echo 'MODIFICATION=Removed direct period key from functional bottom row only.'
            echo
            echo '=== Source declarations of INTERNET permission ==='
            grep -RIn --exclude-dir=.git 'android.permission.INTERNET' app . 2>/dev/null | head -50 || true
            echo
            echo '=== Network/telemetry keyword review (informational, not proof) ==='
            grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md' 'FirebaseAnalytics|Crashlytics|Sentry|Amplitude|Mixpanel|HttpURLConnection|URLConnection|OkHttp|Retrofit' app 2>/dev/null | head -100 || true
          } > ../HeliBoard-privacy-audit.txt
      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify final APK has NO Internet permission
        run: |
          APK=$(find src/app/build/outputs/apk/debug -name '*-debug*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK"
          APKA=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -x "$APKA"
          "$APKA" manifest permissions "$APK" | tee HeliBoard-final-permissions.txt
          if grep -Fq 'android.permission.INTERNET' HeliBoard-final-permissions.txt; then
            echo 'FAIL: final APK requests INTERNET permission.' >&2
            exit 1
          fi
          cat HeliBoard-final-permissions.txt >> HeliBoard-privacy-audit.txt
          cp "$APK" HeliBoard-SinPunto-UNOFFICIAL.apk
          sha256sum HeliBoard-SinPunto-UNOFFICIAL.apk | tee -a HeliBoard-privacy-audit.txt
      - name: Archive corresponding modified source (GPLv3)
        run: |
          tar --exclude='src/.git' --exclude='src/.gradle' --exclude='src/**/build' -czf HeliBoard-SinPunto-source.tar.gz src HeliBoard-SinPunto.patch
      - name: Upload HeliBoard test build
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-SinPunto-UNOFFICIAL
          path: |
            HeliBoard-SinPunto-UNOFFICIAL.apk
            HeliBoard-privacy-audit.txt
            HeliBoard-SinPunto.patch
            HeliBoard-SinPunto-source.tar.gz

  anysoftkeyboard:
    name: AnySoftKeyboard Sin Punto
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Clone pinned AnySoftKeyboard
        run: |
          git clone https://github.com/AnySoftKeyboard/AnySoftKeyboard.git src
          cd src
          git checkout 6bf9ae6e2375364d7f19d54687a1b6067c8b0a13
          git submodule update --init --recursive
      - name: Remove direct period keys and give width to Space
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('ime/app/src/main/res').glob('xml*/ext_kbd_bottom_row*.xml'))
          if not files:
              files=list(Path('ime/app/src/main/res').glob('xml/ext_kbd_bottom_row*.xml'))
          changed=0
          for p in files:
              s=p.read_text()
              original=s
              s,n=re.subn(r'\s*<Key\b(?=[^>]*android:codes="46")(?=[^>]*android:keyLabel="\.")[^>]*/>', '', s, flags=re.S)
              if n:
                  # Each removed period key was 10%p in these bottom rows; transfer it to Space.
                  s=s.replace('android:codes="@integer/key_code_space" android:keyWidth="30%p"',
                              'android:codes="@integer/key_code_space" android:keyWidth="40%p"')
                  p.write_text(s)
                  changed += n
          if changed < 1:
              raise SystemExit('Expected AnySoftKeyboard period key not found')
          print('Removed direct period keys:', changed)
          PY
          git diff --check
          git diff > ../AnySoftKeyboard-SinPunto.patch
      - name: Source privacy scan
        working-directory: src
        run: |
          {
            echo 'PROJECT=AnySoftKeyboard'
            echo 'UPSTREAM=https://github.com/AnySoftKeyboard/AnySoftKeyboard'
            echo 'PINNED_SHA=6bf9ae6e2375364d7f19d54687a1b6067c8b0a13'
            echo 'MODIFICATION=Removed direct period key(s) from bottom-row XML and enlarged Space to occupy the removed width.'
            echo
            echo '=== Source declarations of INTERNET permission ==='
            grep -RIn --exclude-dir=.git 'android.permission.INTERNET' ime api 2>/dev/null | head -50 || true
            echo
            echo '=== Network/telemetry keyword review (informational, not proof) ==='
            grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md' 'FirebaseAnalytics|Crashlytics|Sentry|Amplitude|Mixpanel|HttpURLConnection|URLConnection|OkHttp|Retrofit' ime api 2>/dev/null | head -100 || true
          } > ../AnySoftKeyboard-privacy-audit.txt
      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :ime:app:assembleDebug
      - name: Verify final APK has NO Internet permission
        run: |
          APK=$(find src/ime/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          APKA=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -x "$APKA"
          "$APKA" manifest permissions "$APK" | tee AnySoftKeyboard-final-permissions.txt
          if grep -Fq 'android.permission.INTERNET' AnySoftKeyboard-final-permissions.txt; then
            echo 'FAIL: final APK requests INTERNET permission.' >&2
            exit 1
          fi
          cat AnySoftKeyboard-final-permissions.txt >> AnySoftKeyboard-privacy-audit.txt
          cp "$APK" AnySoftKeyboard-SinPunto-UNOFFICIAL.apk
          sha256sum AnySoftKeyboard-SinPunto-UNOFFICIAL.apk | tee -a AnySoftKeyboard-privacy-audit.txt
      - name: Preserve license and patch
        run: |
          cp src/LICENSE AnySoftKeyboard-LICENSE.txt
      - name: Upload AnySoftKeyboard test build
        uses: actions/upload-artifact@v4
        with:
          name: AnySoftKeyboard-SinPunto-UNOFFICIAL
          path: |
            AnySoftKeyboard-SinPunto-UNOFFICIAL.apk
            AnySoftKeyboard-privacy-audit.txt
            AnySoftKeyboard-SinPunto.patch
            AnySoftKeyboard-LICENSE.txt

  swiftfloris:
    name: SwiftFloris Sin Punto
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Clone pinned SwiftFloris
        run: |
          git clone https://github.com/SysAdminDoc/SwiftFloris.git src
          cd src
          git checkout 39a27c277a88de32de6e0cb232e3f434f7224942
          git submodule update --init --recursive
      - name: Remove direct period from all predefined bottom rows
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/kotlin/dev/patrickgold/florisboard/ime/text/keyboard/BottomRowPreset.kt')
          s=p.read_text()
          count=s.count('                BottomRowKey.PERIOD,\n') + s.count('            BottomRowKey.PERIOD,\n')
          if count < 1:
              raise SystemExit('Expected SwiftFloris period preset entries not found')
          s=s.replace('                BottomRowKey.PERIOD,\n','').replace('            BottomRowKey.PERIOD,\n','')
          p.write_text(s)
          print('Removed predefined period entries:', count)
          PY
          git diff --check
          git diff > ../SwiftFloris-SinPunto.patch
      - name: Source privacy scan
        working-directory: src
        run: |
          {
            echo 'PROJECT=SwiftFloris'
            echo 'UPSTREAM=https://github.com/SysAdminDoc/SwiftFloris'
            echo 'PINNED_SHA=39a27c277a88de32de6e0cb232e3f434f7224942'
            echo 'MODIFICATION=Removed PERIOD from predefined bottom-row presets only.'
            echo
            echo '=== Source declarations of INTERNET permission ==='
            grep -RIn --exclude-dir=.git 'android.permission.INTERNET' app 2>/dev/null | head -50 || true
            echo
            echo '=== Network/telemetry keyword review (informational, not proof) ==='
            grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md' 'FirebaseAnalytics|Crashlytics|Sentry|Amplitude|Mixpanel|HttpURLConnection|URLConnection|OkHttp|Retrofit' app 2>/dev/null | head -100 || true
          } > ../SwiftFloris-privacy-audit.txt
      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify final APK has NO Internet permission
        run: |
          APK=$(find src/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          APKA=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -x "$APKA"
          "$APKA" manifest permissions "$APK" | tee SwiftFloris-final-permissions.txt
          if grep -Fq 'android.permission.INTERNET' SwiftFloris-final-permissions.txt; then
            echo 'FAIL: final APK requests INTERNET permission.' >&2
            exit 1
          fi
          cat SwiftFloris-final-permissions.txt >> SwiftFloris-privacy-audit.txt
          cp "$APK" SwiftFloris-SinPunto-UNOFFICIAL.apk
          sha256sum SwiftFloris-SinPunto-UNOFFICIAL.apk | tee -a SwiftFloris-privacy-audit.txt
      - name: Preserve license and patch
        run: |
          cp src/LICENSE SwiftFloris-LICENSE.txt
      - name: Upload SwiftFloris test build
        uses: actions/upload-artifact@v4
        with:
          name: SwiftFloris-SinPunto-UNOFFICIAL
          path: |
            SwiftFloris-SinPunto-UNOFFICIAL.apk
            SwiftFloris-privacy-audit.txt
            SwiftFloris-SinPunto.patch
            SwiftFloris-LICENSE.txt
