name: Build TecladoEspacio v2 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir buildsrc
          unzip -q project-source.zip -d buildsrc
      - name: Build APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk TecladoEspacio-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TecladoEspacio-v2
          path: TecladoEspacio-v2.apk
          if-no-files-found: error
